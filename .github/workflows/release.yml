name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"

      - name: Write release summary
        if: always()
        run: |
          {
            echo "## Environment Monitor $GITHUB_REF_NAME"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| GitHub release | ${{ steps.publish.outcome == 'success' && '✅ Published' || '❌ Failed' }} |"
            echo
            echo "[View release](https://github.com/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME)"
          } >> "$GITHUB_STEP_SUMMARY"
