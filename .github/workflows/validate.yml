name: Validate Environment Monitor

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile integration
        run: python -m compileall -q custom_components tests

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/environment_monitor/manifest.json >/dev/null
          python -m json.tool custom_components/environment_monitor/strings.json >/dev/null
          python -m json.tool custom_components/environment_monitor/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null
