name: Validate Environment Monitor

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python and JSON
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Compile integration
        id: compile
        run: python -m compileall -q custom_components tests

      - name: Run unit tests
        id: tests
        if: always()
        run: python -m unittest discover -s tests

      - name: Validate JSON files
        id: json
        if: always()
        run: |
          python -m json.tool custom_components/environment_monitor/manifest.json >/dev/null
          python -m json.tool custom_components/environment_monitor/strings.json >/dev/null
          python -m json.tool custom_components/environment_monitor/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

      - name: Write validation summary
        if: always()
        run: |
          {
            echo "## Environment Monitor validation"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Python compile | ${{ steps.compile.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Unit tests | ${{ steps.tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| JSON files | ${{ steps.json.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate with HACS
        id: hacs
        # Remove once https://github.com/hacs/integration/issues/5497 is fixed.
        continue-on-error: true
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

      - name: Write HACS summary
        if: always()
        run: |
          {
            echo "## HACS validation"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| HACS repository | ${{ steps.hacs.outcome == 'success' && '✅ Passed' || '⚠️ Upstream validator issue' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.hacs.outcome }}" != "success" ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "See [hacs/integration#5497](https://github.com/hacs/integration/issues/5497)." >> "$GITHUB_STEP_SUMMARY"
          fi

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate with Hassfest
        id: hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Write Hassfest summary
        if: always()
        run: |
          {
            echo "## Hassfest validation"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Home Assistant integration | ${{ steps.hassfest.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
